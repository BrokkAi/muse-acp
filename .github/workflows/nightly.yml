name: nightly

# The live-host suite on supported pinned Muse builds (1.4.11+), and the macOS
# and Windows legs, run once a day instead of on every PR commit so they do not
# hold up the runner queue. ci.yml keeps the Linux build, lint, and unit-test
# checks.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -- --selftest

  # Real `muse serve` against a loopback model provider: no credentials or
  # secrets. The scheduled support floor is Muse 1.4.11; older fingerprints
  # remain historical compatibility evidence but no longer download a live
  # host every night. Bumping a pinned build reruns the whole suite against it;
  # on Windows x64 a leg runs only the workspace-root flows (see the matrix
  # note below).
  live-host:
    name: live-host (muse ${{ matrix.muse.version }}, ${{ matrix.muse.runner }})
    strategy:
      fail-fast: false
      matrix:
        muse:
          - version: 1.4.11-R6667.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 6fda12a6a4f236528dafa707384cf6395fe859b1438ef77c7be26ed9d7976839
          - version: 1.4.12-R6909.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 81e8bb16289203ba8e0ca7f80c4b82e59ba35f5ee50aafef93a2a4116f2cb27f
          - version: 1.4.13-R6996.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 51e97f8de0aa175080e6576cbc055510a95dfe0ededf175c7f6b34fc8e3bf524
          - version: 1.4.14-R7309.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 0809aac7cb58d18f5022b6d05e02aa1974683c0ec430e5f04d25b60ed17de2da
          # macOS arm64 runs only the newest pin.
          - version: 1.4.14-R7309.1
            runner: macos-15
            file: muse-aarch64-macos
            sha256: 1c96114408acbeade9a8fb79e3b4425e5b64d50425938568aef01bdc04ce2e03
          # Windows x64 legs cover the workspace-root flows on each supported
          # pinned build: multi-root `session/start`, and the sticky
          # `turn/start` replacement after a mode change and a load/re-attach.
          # These carry the Win32 verbatim `\\?\C:\...` root form (issue #199).
          - version: 1.4.11-R6667.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 8844783f7e02b2f6b21ad0d60eefb1ddda392576f11fa811ae95e1448bcfa1f8
            tests: workspace-roots
          - version: 1.4.12-R6909.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 2cdc3c73b8cb668153ee25b9b1ec03f42d02cf49f6622dd3328d625c0cc0cdc0
            tests: workspace-roots
          - version: 1.4.13-R6996.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 239c993cedc3768a99103a90b2f7e3d560375036104980e30227ffebf9de0303
            tests: workspace-roots
          - version: 1.4.14-R7309.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 20d18c426cc26e9e4b3cc07008ec07ec97e12e466a2be8cd2797b2e0e2018382
            tests: workspace-roots
    runs-on: ${{ matrix.muse.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install the pinned Muse build
        if: runner.os != 'Windows'
        env:
          MUSE_VERSION: ${{ matrix.muse.version }}
          MUSE_FILE: ${{ matrix.muse.file }}
          MUSE_SHA256: ${{ matrix.muse.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/muse"
          curl --fail --location --silent --show-error --retry 3 \
            "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=${MUSE_VERSION}&file=${MUSE_FILE}" \
            --output "$RUNNER_TEMP/muse/muse"
          echo "${MUSE_SHA256}  $RUNNER_TEMP/muse/muse" | shasum -a 256 --check
          chmod +x "$RUNNER_TEMP/muse/muse"
          "$RUNNER_TEMP/muse/muse" --version
          echo "MUSE_CLI=$RUNNER_TEMP/muse/muse" >> "$GITHUB_ENV"
      - name: Install the pinned Muse build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MUSE_VERSION: ${{ matrix.muse.version }}
          MUSE_FILE: ${{ matrix.muse.file }}
          MUSE_SHA256: ${{ matrix.muse.sha256 }}
        run: |
          $museDir = Join-Path $env:RUNNER_TEMP 'muse'
          New-Item -ItemType Directory -Force -Path $museDir | Out-Null
          $museExe = Join-Path $museDir 'muse.exe'
          $uri = 'https://lookaside.facebook.com/lookaside/muse/download/' +
            "?channel=muse&version=$env:MUSE_VERSION&file=$env:MUSE_FILE"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $museExe
          $actual = (Get-FileHash -LiteralPath $museExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MUSE_SHA256) {
            throw "muse checksum mismatch: $actual"
          }
          & $museExe --version
          "MUSE_CLI=$museExe" >> $env:GITHUB_ENV
      # Muse's shell sandbox uses bubblewrap, which needs the unprivileged
      # user namespaces Ubuntu 24.04 restricts through AppArmor.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the live-host suite
        shell: bash
        env:
          MUSE_ACP_LOOPBACK: '1'
          MUSE_LEG_TESTS: ${{ matrix.muse.tests }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          if [ "${MUSE_LEG_TESTS:-}" = "workspace-roots" ]; then
            for test in \
              workspace_roots_let_muse_read_an_extra_directory \
              a_mode_change_keeps_other_new_sessions_usable \
              a_restarted_adapter_loads_the_session_with_its_history \
              plan_mode_survives_an_adapter_restart; do
              cargo test --locked -p muse-acp --test live_loopback -- --exact --test-threads 1 "$test"
            done
          else
            cargo test --locked -p muse-acp --test live_loopback -- --test-threads 2
            # The MSP client crate on its own, without the adapter.
            cargo test --locked -p muse-msp-client --test live_muse
          fi

  npm-launcher:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test npm/test/launcher.test.cjs

  # Files one issue per failed job, so each failure gets tracked and fixed. A
  # job that keeps failing gets a comment on its open issue rather than a new
  # issue every night.
  report-failures:
    needs: [platform, live-host, npm-launcher]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update an issue for each failed job
        run: |
          set -euo pipefail
          gh label create nightly-failure --color B60205 \
            --description 'A nightly workflow job failed' --force
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.name, .html_url] | @tsv' |
          while IFS=$'\t' read -r job url; do
            title="Nightly failure: $job"
            body="The nightly job \`$job\` failed on \`$GITHUB_SHA\`.

          Job log: $url
          Run: $RUN_URL"
            existing=$(gh issue list --state open --label nightly-failure \
              --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label nightly-failure --body "$body"
            fi
          done
