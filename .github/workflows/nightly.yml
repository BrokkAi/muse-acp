name: nightly

# The live-host suite on every pinned Muse build, and the macOS and Windows
# legs, run once a day instead of on every PR commit so they do not hold up the
# runner queue. ci.yml keeps the Linux build, lint, and unit-test checks.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo run --locked -- --selftest

  # Real `muse serve` against a loopback model provider: no credentials or
  # secrets. Bumping a pinned build reruns the whole suite against it; on
  # Windows x64 a leg runs only the workspace-root flows (see the
  # matrix note below).
  live-host:
    name: live-host (muse ${{ matrix.muse.version }}, ${{ matrix.muse.runner }})
    strategy:
      fail-fast: false
      matrix:
        muse:
          - version: 1.3.0-R3401.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 71b089d055dfe6e4562092bc484896b61bd96fd6ef9fef9da54a14aa174e2a33
          - version: 1.4.1-R4503.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 8b53c9cdbc025bc2d9068bc7016e2c1e51c3a0c608821da17528ad23be900a12
          - version: 1.4.2-R4684.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: dfb3096c91f4767c4d98006460800b7ba906a0b1a408280a926a8dc19a1af64f
          - version: 1.4.3-R5018.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: e671790882bc88d65edb4ae0f713becf378ebf91011034ab75abebe3592dde4f
          - version: 1.4.4-R5419.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: cfc9d068441ff46036ad6bbf30dd794043b25b7efb69648c92c022ccf65f7d19
          - version: 1.4.6-R6000.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 82a495542965a5b6256f7acdb81693451c28640a419d5528ad8340ea93f36f6f
          - version: 1.4.7-R6101.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 36e3dac91f56c15572b95be55d70ee9fd9685cd9ab49f747bab4746c8d7c2518
          - version: 1.4.8-R6256.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 416eaa520e6bf98c7d67f8d2772a2464d41839c1cb7a75d299845400f484fd4b
          - version: 1.4.11-R6667.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 6fda12a6a4f236528dafa707384cf6395fe859b1438ef77c7be26ed9d7976839
          # macOS arm64 runs only the newest pin.
          - version: 1.4.11-R6667.1
            runner: macos-15
            file: muse-aarch64-macos
            sha256: 6c04ce1719844685153ef6f04b98113cb61b942d97f0a8b0bfb3932c343984d9
          # Windows x64 legs cover the workspace-root flows on every pinned
          # build: multi-root `session/start`, and the sticky `turn/start`
          # replacement after a mode change and a load/re-attach. These carry
          # the Win32 verbatim `\\?\C:\...` root form (issue #199). The rest
          # of the suite still meets Windows host-platform gaps (1.4.1/1.4.2
          # answer session/delete with UnsupportedPlatform, and the
          # bash-based shell tests behave differently than on Linux).
          - version: 1.4.1-R4503.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 1f810527b1ddd1517fee201ea3ef94d33fd261349554c9f682fda1d0bbab0f51
            tests: workspace-roots
          - version: 1.4.2-R4684.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 39a97806d315ece0fc5cdbb88c903ef5bc77655f32e66dc22d267a212c5030ba
            tests: workspace-roots
          - version: 1.4.3-R5018.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: dd510f8144d9fbc518f0c86a3a29ce7142600dc4ee6ec967731aab913e32e26b
            tests: workspace-roots
          - version: 1.4.4-R5419.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 5caacb02eea2734405786e50cb42aeea3eeb46b4fa9801cfa666cda225101749
            tests: workspace-roots
          - version: 1.4.6-R6000.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 0b33e58c27ac157e6372626e02d03f22c360dca2878b2c78cfea8805e9b24cc4
            tests: workspace-roots
          - version: 1.4.7-R6101.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 2d1ac7af0a9ea77643cb8690eee70f52f0f8476c46b194f143c831f481aea59d
            tests: workspace-roots
          - version: 1.4.8-R6256.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: f9d7be3fce39eb23a1bdda019568e0ae7156514c75c408f54c8c4ddaa297800e
            tests: workspace-roots
          - version: 1.4.11-R6667.1
            runner: windows-2025
            file: muse-x86-windows.exe
            sha256: 8844783f7e02b2f6b21ad0d60eefb1ddda392576f11fa811ae95e1448bcfa1f8
            tests: workspace-roots
    runs-on: ${{ matrix.muse.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the pinned Muse build
        if: runner.os != 'Windows'
        env:
          MUSE_VERSION: ${{ matrix.muse.version }}
          MUSE_FILE: ${{ matrix.muse.file }}
          MUSE_SHA256: ${{ matrix.muse.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/muse"
          curl --fail --location --silent --show-error --retry 3 \
            "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=${MUSE_VERSION}&file=${MUSE_FILE}" \
            --output "$RUNNER_TEMP/muse/muse"
          echo "${MUSE_SHA256}  $RUNNER_TEMP/muse/muse" | shasum -a 256 --check
          chmod +x "$RUNNER_TEMP/muse/muse"
          "$RUNNER_TEMP/muse/muse" --version
          echo "MUSE_CLI=$RUNNER_TEMP/muse/muse" >> "$GITHUB_ENV"
      - name: Install the pinned Muse build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MUSE_VERSION: ${{ matrix.muse.version }}
          MUSE_FILE: ${{ matrix.muse.file }}
          MUSE_SHA256: ${{ matrix.muse.sha256 }}
        run: |
          $museDir = Join-Path $env:RUNNER_TEMP 'muse'
          New-Item -ItemType Directory -Force -Path $museDir | Out-Null
          $museExe = Join-Path $museDir 'muse.exe'
          $uri = 'https://lookaside.facebook.com/lookaside/muse/download/' +
            "?channel=muse&version=$env:MUSE_VERSION&file=$env:MUSE_FILE"
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $museExe
          $actual = (Get-FileHash -LiteralPath $museExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:MUSE_SHA256) {
            throw "muse checksum mismatch: $actual"
          }
          & $museExe --version
          "MUSE_CLI=$museExe" >> $env:GITHUB_ENV
      # Muse's shell sandbox uses bubblewrap, which needs the unprivileged
      # user namespaces Ubuntu 24.04 restricts through AppArmor.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the live-host suite
        shell: bash
        env:
          MUSE_ACP_LOOPBACK: '1'
          MUSE_LEG_TESTS: ${{ matrix.muse.tests }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
        run: |
          if [ "${MUSE_LEG_TESTS:-}" = "workspace-roots" ]; then
            for test in \
              workspace_roots_let_muse_read_an_extra_directory \
              a_mode_change_keeps_other_new_sessions_usable \
              a_restarted_adapter_loads_the_session_with_its_history \
              plan_mode_survives_an_adapter_restart; do
              cargo test --locked -p muse-acp --test live_loopback -- --exact --test-threads 1 "$test"
            done
          else
            cargo test --locked -p muse-acp --test live_loopback -- --test-threads 2
            # The MSP client crate on its own, without the adapter.
            cargo test --locked -p muse-msp-client --test live_muse
          fi

  npm-launcher:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test npm/test/launcher.test.cjs

  # Files one issue per failed job, so each failure gets tracked and fixed. A
  # job that keeps failing gets a comment on its open issue rather than a new
  # issue every night.
  report-failures:
    needs: [platform, live-host, npm-launcher]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update an issue for each failed job
        run: |
          set -euo pipefail
          gh label create nightly-failure --color B60205 \
            --description 'A nightly workflow job failed' --force
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.name, .html_url] | @tsv' |
          while IFS=$'\t' read -r job url; do
            title="Nightly failure: $job"
            body="The nightly job \`$job\` failed on \`$GITHUB_SHA\`.

          Job log: $url
          Run: $RUN_URL"
            existing=$(gh issue list --state open --label nightly-failure \
              --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label nightly-failure --body "$body"
            fi
          done
