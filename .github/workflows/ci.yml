name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test npm/test/launcher.test.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sh -n install.sh
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: ./target/debug/muse-acp --selftest
      - run: node scripts/smoke_npm.cjs target/debug/muse-acp

  platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- --selftest

  # Real `muse serve` against a loopback model provider: no credentials or
  # secrets. Bumping a pinned build reruns the whole suite against it.
  live-host:
    name: live-host (muse ${{ matrix.muse.version }}, ${{ matrix.muse.runner }})
    strategy:
      fail-fast: false
      matrix:
        muse:
          - version: 1.3.0-R3401.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 71b089d055dfe6e4562092bc484896b61bd96fd6ef9fef9da54a14aa174e2a33
          - version: 1.4.1-R4503.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: 8b53c9cdbc025bc2d9068bc7016e2c1e51c3a0c608821da17528ad23be900a12
          - version: 1.4.2-R4684.1
            runner: ubuntu-24.04
            file: muse-x86-linux
            sha256: dfb3096c91f4767c4d98006460800b7ba906a0b1a408280a926a8dc19a1af64f
          # macOS arm64 runs only the newest pin, to spare runner time.
          - version: 1.4.2-R4684.1
            runner: macos-15
            file: muse-aarch64-macos
            sha256: e9987ef4267a648dc1931c2836a23f6f16f8b4417368b126a810bece2abd308d
    runs-on: ${{ matrix.muse.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install the pinned Muse build
        env:
          MUSE_VERSION: ${{ matrix.muse.version }}
          MUSE_FILE: ${{ matrix.muse.file }}
          MUSE_SHA256: ${{ matrix.muse.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/muse"
          curl --fail --location --silent --show-error --retry 3 \
            "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=${MUSE_VERSION}&file=${MUSE_FILE}" \
            --output "$RUNNER_TEMP/muse/muse"
          echo "${MUSE_SHA256}  $RUNNER_TEMP/muse/muse" | shasum -a 256 --check
          chmod +x "$RUNNER_TEMP/muse/muse"
          "$RUNNER_TEMP/muse/muse" --version
          echo "MUSE_CLI=$RUNNER_TEMP/muse/muse" >> "$GITHUB_ENV"
      # Muse's shell sandbox uses bubblewrap, which needs the unprivileged
      # user namespaces Ubuntu 24.04 restricts through AppArmor.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked --test live_loopback -- --test-threads 2
        env:
          MUSE_ACP_LOOPBACK: '1'

  # One check over every live-host leg. Pull requests to master require it;
  # its name stays the same when a pinned build changes.
  live-host-result:
    name: live-host
    needs: live-host
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every live-host leg to pass
        env:
          RESULT: ${{ needs.live-host.result }}
        run: test "$RESULT" = success

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      - run: cargo test --locked

  npm-launcher:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test npm/test/launcher.test.cjs
