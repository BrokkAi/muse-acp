name: ci
on:
  # Topic branches are covered by their pull_request run; a branch-wide push
  # trigger ran every PR commit twice. Master, release topics, and tags keep
  # push runs because RELEASING.md's preflight and tag checks need them.
  push:
    branches: ['master', 'brb/release-*']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A new commit on a PR cancels that PR's superseded run. Push runs each get
# their own group, so release evidence is never cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The integration tests spend their time waiting on child processes rather
  # than computing, so libtest's default of one thread per core leaves a hosted
  # runner mostly idle. An explicit `--test-threads` still takes precedence.
  RUST_TEST_THREADS: '16'
  # A hosted runner starts from a fresh checkout, so incremental compilation
  # has nothing to reuse; its artifacts would only make the cache below larger.
  CARGO_INCREMENTAL: '0'

jobs:
  # `lint` and `test` run side by side, so a pull request waits for the slower
  # of the two instead of for one after the other. `check` is the status that
  # branch protection requires, and it passes only when both of them did.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          components: rustfmt, clippy
      # Compiled dependencies, keyed on the compiler and Cargo.lock, so a run
      # rebuilds only this repository's own crates. Only this workflow has a
      # cache: release.yml and nightly.yml never restore one, so nothing saved
      # here can reach a published binary.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test npm/test/launcher.test.cjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: sh -n install.sh
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: cargo test --locked --workspace
      - run: ./target/debug/muse-acp --selftest
      - run: node scripts/smoke_npm.cjs target/debug/muse-acp

  check:
    needs: [lint, test]
    # Without this a failed dependency would skip the job, and GitHub counts a
    # skipped required check as passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint and test to have passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, test: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: toolchain
        with:
          toolchain: 1.88.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-msrv-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked --workspace

  npm-launcher:
    # macOS and Windows run in nightly.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test npm/test/launcher.test.cjs
