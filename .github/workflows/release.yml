name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Verify tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}" >&2
            exit 1
          fi
      - run: cargo test --locked
      - run: cargo run --locked -- --selftest

  create-release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${draft}" != "true" ]]; then
              echo "Release ${GITHUB_REF_NAME} already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --draft
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package and upload Unix archive
        if: matrix.archive == 'tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          package="muse-acp-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/${package}"
          install -m 0755 "target/${TARGET}/release/muse-acp" "dist/${package}/muse-acp"
          cp README.md LICENSE NOTICE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
            else
              shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"
            fi
          )
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/${package}.tar.gz" \
            "dist/${package}.tar.gz.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
      - name: Package and upload Windows archive
        if: matrix.archive == 'zip'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "muse-acp-$env:GITHUB_REF_NAME-$env:TARGET"
          $packageDir = Join-Path "dist" $package
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/$env:TARGET/release/muse-acp.exe" $packageDir
          Copy-Item README.md, LICENSE, NOTICE $packageDir
          $archive = "dist/$package.zip"
          $checksum = "$archive.sha256"
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Out-File $checksum -Encoding ascii
          gh release upload $env:GITHUB_REF_NAME $archive $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
