[package]
name = "acp-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Synchronous Rust SDK for both sides of the Agent Client Protocol: clients and agents"
license = "Apache-2.0"
repository = "https://github.com/BrokkAi/muse-acp"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
