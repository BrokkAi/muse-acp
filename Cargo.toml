[workspace]
members = ["crates/acp-lite", "crates/muse-msp-client"]
resolver = "3"

[package]
name = "muse-acp"
version = "0.19.0"
edition = "2024"
rust-version = "1.88"
description = "Rust ACP-to-MSP adapter for using Muse Code in Zed and JetBrains IDEs"
license = "Apache-2.0"
repository = "https://github.com/BrokkAi/muse-acp"
readme = "README.md"
publish = false

[dependencies]
# The workspace's own MSP client, which has no dependencies of its own.
muse-msp-client = { path = "crates/muse-msp-client" }
# ACP goes through acp-lite's agent side. The adapter converts its own JSON
# values to and from serde_json at that boundary, keeping number text and key
# order.
acp-lite = { path = "crates/acp-lite" }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
