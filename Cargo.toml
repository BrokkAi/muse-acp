[workspace]
members = ["crates/acp-lite", "crates/muse-msp-client"]
resolver = "3"

[package]
name = "muse-acp"
version = "0.16.0"
edition = "2024"
rust-version = "1.88"
description = "Rust ACP-to-MSP adapter for using Muse Code in Zed and JetBrains IDEs"
license = "Apache-2.0"
repository = "https://github.com/BrokkAi/muse-acp"
readme = "README.md"
publish = false

[dependencies]
# The workspace's own MSP client. It has no dependencies of its own, so the
# shipped binary stays free of third-party code.
muse-msp-client = { path = "crates/muse-msp-client" }

[dev-dependencies]
# Test-only schema validation against the vendored MSP bundle; the shipped
# binary remains free of third-party dependencies.
serde_json = { version = "1", features = ["arbitrary_precision"] }
acp-lite = { path = "crates/acp-lite" }
