[workspace]
members = ["crates/muse-msp-client"]
resolver = "3"

[package]
name = "muse-acp"
version = "0.20.0"
edition = "2024"
rust-version = "1.88"
description = "Rust ACP-to-MSP adapter for using Muse Code in Zed and JetBrains IDEs"
license = "Apache-2.0"
repository = "https://github.com/BrokkAi/muse-acp"
readme = "README.md"
publish = false

[dependencies]
# The workspace's own MSP client, which has no dependencies of its own.
muse-msp-client = { path = "crates/muse-msp-client" }
# ACP goes through the official SDK. The exact pin matters: the SDK's
# `unstable_*` features, including protocol v2, may change in a minor release.
agent-client-protocol = { version = "=5.0.0", features = [
    "unstable_protocol_v2",
    "unstable_session_fork",
    "unstable_subagents",
] }
# The SDK is runtime-neutral: its connection runs on one thread under the
# `futures` executor, with stdin and stdout made async by `blocking`.
blocking = "1"
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
